name = "ora-pm"
compatibility_date = "2024-09-23"
pages_build_output_dir = "./dist"

# Secrets (set via: wrangler pages secret put <NAME>)
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# CRON_SECRET            ← random 32-char string; ORA scheduler sends as Bearer token
# STRIPE_SECRET_KEY      ← set via wrangler pages secret put STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET  ← set via wrangler pages secret put STRIPE_WEBHOOK_SECRET
#
# RESEND_API_KEY / RESEND_FROM_EMAIL are NOT used by this app (removed
# 2026-08-04, OI-047) — this Worker no longer sends email itself. If they're
# still provisioned as live Pages secrets, they're orphaned; safe to delete
# (`wrangler pages secret delete RESEND_API_KEY` / `RESEND_FROM_EMAIL`) as a
# follow-up, not required for this app to function correctly.

# Scheduled HTTP crons — POSTed with `Authorization: Bearer <CRON_SECRET>`
# (Cloudflare Pages has no native cron triggers, and this account has no
# workers.dev subdomain either, so a cron Worker can't attach schedules).
# Driven by a standalone Windows Task Scheduler task ("ORA PM Crons",
# Interactive logon, independent of whether Claude Desktop is open) running
# C:\Users\Owner\ora-pm-cron\ping-crons.ps1 — NOT the Claude dual-fleet
# scheduled-task registry. Since OI-047 (2026-08-04), critical-dates-alerts
# and delinquency-check return an `email` field instead of sending email
# themselves; ping-crons.ps1 sends it via Outlook COM. monthly-billing is
# not currently pinged by ping-crons.ps1 (no email path, not part of OI-047).
#   POST /api/cron/monthly-billing            — monthly, 1st of month (not yet wired to a trigger)
#   POST /api/cron/critical-dates-alerts      — daily ~09:00 ET
#   POST /api/cron/delinquency-check          — daily ~09:00 ET

# OI-038 remainder: durable, cross-isolate rate-limit counter storage (see
# server/lib/rate-limit.ts for the eventually-consistent throttle-not-hard-
# gate design). checkRateLimit() degrades gracefully to memory-only when this
# binding is absent, so leaving it unprovisioned is SAFE (weaker rate
# limiting, not a crash) — but it must be provisioned before this is a real
# fix in production. Manual one-time step (not run as part of this change —
# provisioning a live KV namespace against a real Cloudflare account is an
# infra action outside this code change's scope):
#   1. wrangler kv namespace create RATE_LIMIT_KV
#   2. paste the returned id below in place of the placeholder
#   3. uncomment the [[kv_namespaces]] block below
#
# REFUTE-pass correction (2026-08-03): left UNCOMMENTED with a placeholder id,
# this block would likely fail `wrangler pages deploy` outright (an invalid
# namespace id is a deploy-time error, not a runtime no-op) — blocking this
# entire deploy, not "safely degrading" as the code comments above describe.
# Commented out until a real id is provisioned, so the code's own documented
# graceful-degradation path (kv undefined -> memory-only) is what actually
# runs, matching the claim.
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_WITH_REAL_NAMESPACE_ID"
