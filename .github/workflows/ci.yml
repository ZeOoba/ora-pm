name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Serialize runs per ref so two merges minutes apart cannot race their
# Cloudflare deploys (the last wrangler upload to finish wins production).
#   - main: never cancel a run mid-deploy. GitHub keeps at most one pending
#     run per group and cancels an older pending run when a newer one queues.
#   - PRs: cancel superseded runs on the same PR (refs/pull/N/merge).
# Re-runs of old commits re-enter the group, and queue order is not relied
# on, so the deploy step also checks the commit is still main's tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      - name: Check commit is still the tip of main
        id: tip
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          # ls-remote patterns tail-match (refs/heads/x/refs/heads/main), so filter exactly.
          tip="$(git ls-remote --exit-code origin refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }')"
          if [ -z "$tip" ]; then
            echo "::error::Could not resolve origin/main; refusing to deploy"
            exit 1
          fi
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            # Warning, not notice: if the newer commit has no CI run ([skip ci], cancelled), nothing deploys.
            echo "::warning::Skipping deploy: $GITHUB_SHA is no longer the tip of main ($tip); the newer commit's run must deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.tip.outputs.deploy == 'true'
        run: npx wrangler pages deploy ./dist --project-name ora-pm --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
