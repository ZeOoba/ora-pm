name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Serialize runs per ref so two merges minutes apart cannot race their
# Cloudflare deploys (the last wrangler upload to finish wins production).
#   - main: never cancel a run mid-deploy. GitHub keeps at most one pending
#     run per group and cancels an older pending run when a newer one queues.
#   - PRs: cancel superseded runs on the same PR (refs/pull/N/merge).
# Re-runs of old commits re-enter the group, and queue order is not relied
# on, so the deploy step also checks the commit is still main's tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # issues: write is for the deploy-failure alert (last step); actions: read lets the REFUTE gate
    # find the last successful push run on main (its base); everything else only reads.
    permissions:
      contents: read
      issues: write
      actions: read
    # Throwaway Postgres for the GL money-rule suite (scripts/verify-gl-sql.sh). pg-mem cannot run
    # the plpgsql triggers that enforce balance, immutability and period locks, so this is the
    # only place CI executes them. Test-only credentials; the container dies with the job.
    services:
      postgres:
        # Match production (Supabase, Postgres 17): privileges such as MAINTAIN differ by major version.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the REFUTE gate below diffs the PR against its base ref
          # (origin/main...HEAD needs a merge base a shallow clone cannot supply).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Invariant 3 pre-push gate (scripts/prepush_confidential_scan.py): end-to-end tests that
      # run real `git push`es through the shipped shim. Stdlib Python only.
      - name: Pre-push confidentiality gate tests
        run: python3 scripts/test_prepush_confidential_scan.py

      - name: Pre-push installed-hook (pinned-first) tests
        run: python3 scripts/test_install_prepush_hook.py

      - name: Type check
        run: npm run typecheck

      # OI-255: `lint` was aliased to `tsc --noEmit` — this is now real ESLint (eslint.config.js).
      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # B8 ledger: run the real-Postgres GL suite on every PR and before every production deploy.
      # A failure here blocks the deploy steps below.
      - name: GL money rules on real Postgres
        env:
          GL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run verify:gl-sql

      # Off-host backup-trigger self-test (no network: CURL_BIN stub). It also runs
      # inside delinquency-backup.yml before each scheduled POST, which only ever
      # exercised it after merge; running it here gates the script on every PR.
      - name: Backup-trigger self-test (no network)
        run: bash scripts/delinquency-backup.test.sh

      # Deploy-env gate (scripts/check-deploy-env.mjs): a required var missing from the
      # build env or from Pages production blocks the deploy; deferred vars only warn.
      # Strict on main pushes, warn-only elsewhere so PRs surface it without blocking.
      - name: Check build-time env
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            node scripts/check-deploy-env.mjs build
          else
            node scripts/check-deploy-env.mjs build --warn-only
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      - name: Preview Cloudflare Pages production env (PR, warn-only)
        if: github.event_name == 'pull_request'
        run: node scripts/check-deploy-env.mjs pages --warn-only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      # OI-255 REFUTE gate: a change to a financial-decision file (autopay debits + late fees in
      # server/routes/cron.ts, ACH PaymentIntents in server/routes/stripe.ts, webhook state
      # transitions, CAM true-up, manual charge/payment posting, the charge/payment schemas, or a
      # migration touching charges/payments/ar_ledger) must carry a `Refute-Reviewed:` or
      # `Refute-Skip:` commit trailer attesting an adversarial review ran.
      # Runs on BOTH events (audit 2026-11-23 MED refute-gate-skipped-on-push-to-main). A pull
      # request diffs against its base. A push to main diffs against the head commit of the LAST
      # SUCCESSFUL push run of this workflow on main -- the last range that passed this gate and
      # every deploy step -- not github.event.before: a money commit whose own run failed, was
      # [skip ci], or was cancelled while pending would otherwise ship with the next unrelated push
      # (review round 1, reproduced). The pushed tip must descend from that anchor, so a force-push
      # that rewrites or drops already-deployed history fails closed. Squash merges keep the PR's
      # commit messages (repo setting COMMIT_MESSAGES), so a reviewed PR's trailer is in the range.
      # It sits in this job ahead of the deploy steps, so a failing gate fails the job before
      # anything ships; any doubt (no anchor, lookup error, not an ancestor, base does not resolve
      # under --strict) blocks the deploy, deliberately.
      - name: REFUTE gate (financial-decision paths)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            # Full ref name: a bare `origin/<base>` is resolved by git as refs/tags/origin/<base> FIRST
            # if such a tag exists, which would let a tag shadow the real base and empty the range.
            base="refs/remotes/origin/$BASE_REF"
          else
            base="$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event push \
              --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"
            if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::REFUTE gate: no last successful push run on main to anchor the range (got '$base'); refusing to deploy unchecked"
              exit 1
            fi
            git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags origin "$base" || true
            if ! git merge-base --is-ancestor "$base" HEAD; then
              echo "::error::REFUTE gate: $GITHUB_SHA does not descend from the last deployed commit $base (force-push or rewritten main); refusing to deploy"
              exit 1
            fi
            # One first-parent commit at a time (review round 2): a range-level check would let one
            # reviewed commit's trailer approve an unreviewed money commit pushed after it while the
            # anchor is stalled (e.g. a migration merge whose run awaits db-migrate). A squash or
            # merge commit is still judged as a whole (C^1..C includes the merged PR's commits).
            commits="$(git rev-list --first-parent --reverse "$base"..HEAD)"
            for c in $commits; do
              echo "REFUTE gate: checking $c"
              npm run --silent check:refute -- --strict --base="$c^1" --head="$c"
            done
            exit 0
          fi
          npm run check:refute -- --strict --base="$base"

      # Migration-number collision gate (scripts/check-migration-numbers.mjs): unique NNNN numbers,
      # and every migration this PR adds is numbered above everything on the base. Two sessions
      # picked 0024 in parallel on 2026-11-10 (#75/#76). On pushes to main it still checks
      # uniqueness. migration-numbers.yml runs the same check on every branch push, because a PR
      # that conflicts with main gets no pull_request run at all.
      - name: Migration numbers
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            npm run check:migrations -- --base="refs/remotes/origin/${{ github.base_ref }}"
          else
            npm run check:migrations
          fi

      - name: Check commit is still the tip of main
        id: tip
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          # ls-remote patterns tail-match (refs/heads/x/refs/heads/main), so filter exactly.
          tip="$(git ls-remote --exit-code origin refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }')"
          if [ -z "$tip" ]; then
            echo "::error::Could not resolve origin/main; refusing to deploy"
            exit 1
          fi
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            # Warning, not notice: if the newer commit has no CI run ([skip ci], cancelled), nothing deploys.
            echo "::warning::Skipping deploy: $GITHUB_SHA is no longer the tip of main ($tip); the newer commit's run must deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # OI-312 deploy-ordering gate. db-migrate.yml is workflow_dispatch-only and deliberately
      # decoupled, so without this step a push to main could deploy the app BEFORE the migration it
      # depends on -- 0016_charges_void.sql's header says the app must deploy AFTER 0016 is live,
      # because `.is('voided_at', null)` raises 42703 against the old schema. That nearly happened
      # merging PR #42; it was caught only because a human was watching CI live.
      # Gated identically to the Cloudflare-env check below, and fails closed on any doubt.
      # Pinned to the same CLI version as db-migrate.yml (keep the two in step). It was `latest`
      # until 2026-11-09, when `migration list` was exiting non-zero in both workflows under CLI
      # v3.x (v3.0.0 shipped 2026-11-02; suspected cause). 2.122.1 is the last v2 release. Bump deliberately,
      # after a db-migrate dry run on the new version passes. A CLI output change would break the
      # gate's parser -- which fails CLOSED, so the worst case is a blocked deploy.
      - uses: supabase/setup-cli@v1
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.tip.outputs.deploy == 'true'
        with:
          version: 2.122.1

      # `migration list --linked` needs link state, which a fresh CI checkout does not have.
      - name: Link to production project (for the migration gate)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.tip.outputs.deploy == 'true'
        run: supabase link --project-ref tvfarkddtbtdrpvvehth --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Check migrations are applied
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.tip.outputs.deploy == 'true'
        run: node scripts/check-migrations-applied.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Check Cloudflare Pages production env
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.tip.outputs.deploy == 'true'
        # Retries only on a transient Cloudflare failure (5xx / non-JSON reply); a missing variable fails at once.
        run: scripts/retry-transient.sh node scripts/check-deploy-env.mjs pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.tip.outputs.deploy == 'true'
        # A re-upload is idempotent (wrangler skips files already uploaded); retried only on a transient Cloudflare failure.
        run: scripts/retry-transient.sh npx wrangler pages deploy ./dist --project-name ora-pm --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # A failed run on main means production did not get this commit. Nobody watches CI, so open
      # (or comment on) one "Production deploy failed" issue; GitHub notifies the repo owner. The
      # issue says only which commit and run failed (the repo is public): no logs, no env.
      - name: Alert on a failed production deploy
        if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Production did not get \`${GITHUB_SHA::7}\` (run attempt ${GITHUB_RUN_ATTEMPT}): ${run_url}. Fix or re-run the failed job; close this issue once main deploys."
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Production deploy failed"' --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Production deploy failed" --body "$body"
          fi
