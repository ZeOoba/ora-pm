name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Debug react-router-dom resolution
        run: |
          echo "--- node_modules top-level count ---"
          ls node_modules | wc -l
          echo "--- react-router entries in node_modules ---"
          ls -la node_modules | grep -i router || echo "NONE FOUND"
          echo "--- npm ls ---"
          npm ls react-router-dom react-router 2>&1 || true
          echo "--- package-lock.json integrity check ---"
          npm ci --dry-run 2>&1 | grep -i "react-router" || echo "no react-router lines in dry-run"
          echo "--- .npmrc / env ---"
          npm config list
          env | grep -i npm || true

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx wrangler pages deploy ./dist --project-name ora-pm --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
