name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Serialize runs per ref so two merges minutes apart cannot race their
# Cloudflare deploys (the last wrangler upload to finish wins production).
#   - main: never cancel a run mid-deploy. GitHub keeps at most one pending
#     run per group and cancels an older pending run when a newer one queues.
#   - PRs: cancel superseded runs on the same PR (refs/pull/N/merge).
# Re-runs of old commits re-enter the group, and queue order is not relied
# on, so the deploy step also checks the commit is still main's tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the REFUTE gate below diffs the PR against its base ref
          # (origin/main...HEAD needs a merge base a shallow clone cannot supply).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # OI-255: `lint` was aliased to `tsc --noEmit` — this is now real ESLint (eslint.config.js).
      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # Deploy-env gate (scripts/check-deploy-env.mjs): a required var missing from the
      # build env or from Pages production blocks the deploy; deferred vars only warn.
      # Strict on main pushes, warn-only elsewhere so PRs surface it without blocking.
      - name: Check build-time env
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            node scripts/check-deploy-env.mjs build
          else
            node scripts/check-deploy-env.mjs build --warn-only
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      - name: Preview Cloudflare Pages production env (PR, warn-only)
        if: github.event_name == 'pull_request'
        run: node scripts/check-deploy-env.mjs pages --warn-only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      # OI-255 REFUTE gate: a change to a financial-decision file (autopay debits + late fees in
      # server/routes/cron.ts, ACH PaymentIntents in server/routes/stripe.ts, webhook state
      # transitions, CAM true-up, manual charge/payment posting, the charge/payment schemas, or a
      # migration touching charges/payments/ar_ledger) must carry a `Refute-Reviewed:` or
      # `Refute-Skip:` commit trailer attesting an adversarial review ran.
      # PR-only: it diffs the PR against its base; a direct push to main has no diff base, so it is
      # skipped there. It sits in this job ahead of the deploy steps, so a failing gate fails the
      # job before anything ships — make this workflow a REQUIRED check via branch protection to
      # hard-enforce it at merge. Fails OPEN on git/tooling gaps (scripts/check-refute-required.ts).
      - name: REFUTE gate (financial-decision paths)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          npm run check:refute -- --strict --base="origin/${{ github.base_ref }}"

      - name: Check commit is still the tip of main
        id: tip
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          # ls-remote patterns tail-match (refs/heads/x/refs/heads/main), so filter exactly.
          tip="$(git ls-remote --exit-code origin refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }')"
          if [ -z "$tip" ]; then
            echo "::error::Could not resolve origin/main; refusing to deploy"
            exit 1
          fi
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            # Warning, not notice: if the newer commit has no CI run ([skip ci], cancelled), nothing deploys.
            echo "::warning::Skipping deploy: $GITHUB_SHA is no longer the tip of main ($tip); the newer commit's run must deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # OI-312 deploy-ordering gate. db-migrate.yml is workflow_dispatch-only and deliberately
      # decoupled, so without this step a push to main could deploy the app BEFORE the migration it
      # depends on -- 0016_charges_void.sql's header says the app must deploy AFTER 0016 is live,
      # because `.is('voided_at', null)` raises 42703 against the old schema. That nearly happened
      # merging PR #42; it was caught only because a human was watching CI live.
      # Gated identically to the Cloudflare-env check below, and fails closed on any doubt.
      # `version: latest` matches db-migrate.yml rather than inventing a second pin. A CLI output
      # change would break the gate's parser -- which fails CLOSED with an explicit "format may have
      # changed" error, so the worst case is a blocked deploy, never a silently-skipped check.
      - uses: supabase/setup-cli@v1
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.tip.outputs.deploy == 'true'
        with:
          version: latest

      # `migration list --linked` needs link state, which a fresh CI checkout does not have.
      - name: Link to production project (for the migration gate)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.tip.outputs.deploy == 'true'
        run: supabase link --project-ref tvfarkddtbtdrpvvehth --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Check migrations are applied
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.tip.outputs.deploy == 'true'
        run: node scripts/check-migrations-applied.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Check Cloudflare Pages production env
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.tip.outputs.deploy == 'true'
        run: node scripts/check-deploy-env.mjs pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.tip.outputs.deploy == 'true'
        run: npx wrangler pages deploy ./dist --project-name ora-pm --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
