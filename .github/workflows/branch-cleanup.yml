name: Branch cleanup

# Deletes branches whose work is already in main (or was abandoned), because the Claude Code
# agent proxy cannot delete branches. Rules live in scripts/branch-cleanup.mjs (unit-tested in
# tests/unit/branch-cleanup.test.ts): a branch goes only when its tip is exactly the head commit of
# a merged PR, or of a PR closed without merging more than 14 days ago. Never: main, protected
# branches, branches with an open PR, branches with no PR, or commits pushed after the last PR.
#
# Weekly on Mondays 15:00 UTC for real. A manual run defaults to a dry run (prints the plan);
# `branches` names extra branches to delete on a manual run (still never main, protected, or with
# an open PR), for one-offs the rules keep.
# Complements the repo setting "Automatically delete head branches" (Settings > General).

on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print what would be deleted'
        type: boolean
        default: true
      branches:
        description: 'Extra branches to delete (space-separated), manual runs only'
        type: string
        default: ''

permissions:
  contents: write       # delete refs
  pull-requests: read

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Plan and delete
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          EXTRA: ${{ github.event_name == 'workflow_dispatch' && inputs.branches || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --paginate --slurp > branches.json
          gh api "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100" --paginate --slurp > pulls.json
          # shellcheck disable=SC2086  # EXTRA is a space-separated list by design
          node scripts/branch-cleanup.mjs branches.json pulls.json "$DEFAULT_BRANCH" $EXTRA > delete.txt
          echo "$(wc -l < delete.txt) branch(es) to delete"
          if [ "$DRY_RUN" = "true" ]; then echo "Dry run: nothing deleted."; exit 0; fi
          failed=0
          while IFS= read -r b; do
            [ -n "$b" ] || continue
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$b" >/dev/null; then echo "deleted $b"
            else echo "::warning::could not delete $b"; failed=$((failed + 1)); fi
          done < delete.txt
          [ "$failed" -eq 0 ]
