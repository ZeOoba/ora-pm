name: Monthly billing (off-host backup trigger)

# Off-host backup for the laptop-bound `ora-pm-monthly-billing` fleet task
# (CC/MCP registry, cron `10 11 1 * *` ET, runs scripts/trigger-billing.ps1).
# That task only fires while Claude Desktop is open on the ORA laptop; the
# 2026-08-29 -> 09-01 host outage made it miss its 2026-09-01 fire entirely.
#
# This workflow fires 17:40 UTC on the 1st = 13:40 EDT / 12:40 EST, i.e. 90-150
# minutes AFTER the laptop slot AND always in a LATER fixed UTC-hour bucket of
# the endpoint's rate limiter (server/lib/rate-limit.ts: 10 calls/hour/path).
# The laptop drain can spend up to 8 of those; at 16:40 UTC this backup would
# have shared the 16:00-17:00 bucket with the laptop's 16:10 EST slot and been
# throttled after 2 calls (PR #24 review, cross-repo finding). Charge posting
# is idempotent (bulk upsert, ON CONFLICT DO NOTHING on idempotency_key), so:
#   - laptop already ran  -> this posts 0, skips everything, exits 0
#   - laptop was closed   -> this catches the month within ~2 hours
# Drain semantics mirror scripts/trigger-billing.ps1: at most 8 calls, stop
# and FAIL the moment `remaining` stops decreasing, never silently under-drain.
# A 2xx body that is not the endpoint's documented shape (all five counters
# present and numeric) is a FAILURE, not a zero -- this job moves money and
# must never report success on a response it cannot read.
#
# The response body is NEVER printed: this repo is public, so the Actions log is
# too, and the body carries raw database/Stripe error messages, lease ids and
# lease start/end dates (errorMessages, leaseExceptions). The log gets the HTTP
# code and the five numeric counters only; read the detail in the Pages
# Functions (Worker) log. Guarded by tests/unit/workflow-log-egress.test.ts.
# On a non-2xx, only a Cloudflare 1xxx code found in the body is surfaced (the
# same rule as scripts/delinquency-backup.sh). `error code: 1016` inside the
# app's JSON error is Cloudflare's origin DNS error on the Worker's Supabase
# calls: the project's host does not resolve, which is what a paused free-plan
# project looks like. It paused 2026-10-12 after 7 days without activity, and
# this job's 2026-11-01 run failed on it (see delinquency-backup.yml). Restore
# the project, then catch the month up with a
# workflow_dispatch that sets year/month explicitly: a plain re-run of a
# scheduled run has no inputs, so it bills the CURRENT America/New_York month,
# which is the wrong one once the month has rolled over.
#
# Required repo secret: ORA_PM_CRON_SECRET (same value as the Cloudflare Pages
# CRON_SECRET). Set it in GitHub -> Settings -> Secrets -> Actions. The
# workflow refuses to run without it.

on:
  schedule:
    - cron: '40 17 1 * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Billing year (default: current, America/New_York)'
        required: false
      month:
        description: 'Billing month 1-12 (default: current, America/New_York)'
        required: false

permissions:
  contents: read

jobs:
  drain-monthly-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Drain /api/cron/monthly-billing
        env:
          CRON_SECRET: ${{ secrets.ORA_PM_CRON_SECRET }}
          BASE_URL: https://ora-pm.pages.dev
          IN_YEAR: ${{ github.event.inputs.year }}
          IN_MONTH: ${{ github.event.inputs.month }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::ORA_PM_CRON_SECRET repo secret is not set -- refusing to run"
            exit 1
          fi
          YEAR="${IN_YEAR:-$(TZ=America/New_York date +%Y)}"
          MONTH="${IN_MONTH:-$(TZ=America/New_York date +%-m)}"
          MAX_INVOCATIONS=8
          remaining=1; prev=""; inv=0
          total_posted=0; total_skipped=0; total_charge_err=0; total_autopay_err=0
          while [ "$remaining" -gt 0 ] && [ "$inv" -lt "$MAX_INVOCATIONS" ]; do
            inv=$((inv+1))
            url="${BASE_URL}/api/cron/monthly-billing?year=${YEAR}&month=${MONTH}"
            resp=$(curl -sS --max-time 60 -X POST "$url" \
                     -H "Authorization: Bearer ${CRON_SECRET}" \
                     -H "Content-Type: application/json" \
                     -w '\n%{http_code}') || { echo "::error::curl failed on invocation $inv"; exit 1; }
            code=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')
            case "$code" in
              2[0-9][0-9]) ;;
              *)
                echo "::error::invocation $inv -> HTTP $code (body withheld: may contain database/Stripe errors and lease data; see the Pages Functions log)"
                # Only a Cloudflare 1xxx code is lifted out of the body (it is not
                # tenant or lease data); the rest stays withheld. Here-strings, not
                # pipes, feed grep so pipefail cannot turn an early-exit match into a miss.
                if grep -qE '"error" *: *"[^"]*error code: 1016([^0-9.]|$)' <<< "$body"; then
                  echo "::error::Cloudflare error 1016 (origin DNS error) on the Worker's Supabase calls: the host in the Pages SUPABASE_URL secret does not resolve. Most likely the Supabase project is PAUSED. Restore it from the Supabase dashboard, then re-run via workflow_dispatch with year/month set."
                else
                  cf=$(grep -oE 'error code: 1[0-9]{3}([^0-9.]|$)' <<< "$body" | head -n1 | grep -oE '1[0-9]{3}' || true)
                  if [ -n "$cf" ]; then
                    echo "::error::Cloudflare error $cf in the response: an edge or Worker-runtime error, failing layer not identified. Check the Pages Functions log and the Supabase project status."
                  fi
                fi
                exit 1 ;;
            esac
            # Strict shape check: every counter must be present AND numeric.
            # Defaulting absent fields to 0 would let `{}` (or any wrong-shaped
            # 2xx) terminate the drain as "remaining=0, no errors" with no
            # evidence billing ran.
            if ! printf '%s' "$body" | jq -e '
                  (.posted|type)=="number" and (.skipped|type)=="number"
                  and (.chargeErrors|type)=="number" and (.autopayErrors|type)=="number"
                  and (.remaining|type)=="number"' >/dev/null 2>&1; then
              echo "::error::invocation $inv -> HTTP $code but body is not the monthly-billing response shape (need numeric posted/skipped/chargeErrors/autopayErrors/remaining; body withheld)"
              exit 1
            fi
            posted=$(printf '%s' "$body" | jq -r '.posted')
            skipped=$(printf '%s' "$body" | jq -r '.skipped')
            cerr=$(printf '%s' "$body" | jq -r '.chargeErrors')
            aerr=$(printf '%s' "$body" | jq -r '.autopayErrors')
            remaining=$(printf '%s' "$body" | jq -r '.remaining')
            echo "invocation $inv: posted=$posted skipped=$skipped chargeErrors=$cerr autopayErrors=$aerr remaining=$remaining"
            total_posted=$((total_posted+posted)); total_skipped=$((total_skipped+skipped))
            total_charge_err=$((total_charge_err+cerr)); total_autopay_err=$((total_autopay_err+aerr))
            if [ -n "$prev" ] && [ "$remaining" -ge "$prev" ] && [ "$remaining" -gt 0 ]; then
              echo "::error::remaining did not decrease ($prev -> $remaining) -- stalled drain, see trigger-billing.ps1 round-5 note"
              exit 1
            fi
            prev="$remaining"
          done
          echo "TOTAL ${YEAR}-${MONTH}: posted=$total_posted skipped=$total_skipped chargeErrors=$total_charge_err autopayErrors=$total_autopay_err remaining=$remaining"
          if [ "$remaining" -gt 0 ]; then echo "::error::remaining=$remaining after $inv invocation(s)"; exit 1; fi
          if [ "$total_charge_err" -gt 0 ] || [ "$total_autopay_err" -gt 0 ]; then echo "::error::non-zero error counts"; exit 1; fi
